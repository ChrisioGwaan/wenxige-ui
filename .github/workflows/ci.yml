name: CI

on:
  pull_request:
    branches: [feature]
    paths:
      - 'wenxige-saas/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [feature]
    paths:
      - 'wenxige-saas/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wenxige-saas

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `next build` can complete in CI.
      # Real values live in Vercel and are injected at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # Cloudflare's official Turnstile test site key (always passes).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/wenxige-saas/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('wenxige-saas/bun.lock', 'wenxige-saas/bun.lockb') }}-${{ hashFiles('wenxige-saas/**/*.[jt]s', 'wenxige-saas/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('wenxige-saas/bun.lock', 'wenxige-saas/bun.lockb') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
