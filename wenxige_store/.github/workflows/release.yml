name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: 📚 Checkout
      uses: actions/checkout@v4
      
    - name: 🏷️ Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: 📝 Generate changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v4
      with:
        configuration: ".github/changelog-config.json"
        fromTag: ${{ steps.version.outputs.version }}
        toTag: HEAD
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🚀 Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        body: |
          ## 🎉 What's New in ${{ steps.version.outputs.version }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### 📱 Download Options
          
          - **Android APK**: See build artifacts below
          - **Web App**: [Visit Live Site](https://wenxige-store.web.app)
          - **iOS**: Available through TestFlight (contact team for access)
          
          ### 🔧 Technical Details
          
          - Flutter Version: ${{ env.FLUTTER_VERSION }}
          - Build Date: ${{ steps.date.outputs.date }}
          - Commit: ${{ github.sha }}
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/previous-tag...${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}

  build-release-artifacts:
    name: Build Release Artifacts
    needs: create-release
    strategy:
      matrix:
        platform: [android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: 📚 Checkout
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java (Android only)
      if: matrix.platform == 'android'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: 📦 Install dependencies
      run: flutter pub get
      
    - name: 🔧 Build Android APK
      if: matrix.platform == 'android'
      run: |
        flutter build apk --release --split-per-abi
        flutter build appbundle --release
        
    - name: 🌐 Build Web
      if: matrix.platform == 'web'
      run: flutter build web --release --web-renderer canvaskit
      
    - name: 📦 Package Web Build
      if: matrix.platform == 'web'
      run: |
        cd build/web
        tar -czf ../../wenxige-store-web-${{ needs.create-release.outputs.version }}.tar.gz .
        
    - name: 📱 Upload Android Artifacts
      if: matrix.platform == 'android'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        asset_name: wenxige-store-arm64-v8a-${{ needs.create-release.outputs.version }}.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: 🌐 Upload Web Artifacts
      if: matrix.platform == 'web'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: wenxige-store-web-${{ needs.create-release.outputs.version }}.tar.gz
        asset_name: wenxige-store-web-${{ needs.create-release.outputs.version }}.tar.gz
        asset_content_type: application/gzip

  notify-release:
    name: Notify Team
    needs: [create-release, build-release-artifacts]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📢 Slack Notification
      if: vars.SLACK_WEBHOOK_URL
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.build-release-artifacts.result == 'success' && 'success' || 'failure' }}
        channel: '#releases'
        username: 'Release Bot'
        icon_emoji: ':rocket:'
        title: 'Release ${{ needs.create-release.outputs.version }}'
        message: |
          **Status:** ${{ needs.build-release-artifacts.result == 'success' && '✅ Success' || '❌ Failed' }}
          **Version:** ${{ needs.create-release.outputs.version }}
          **Platform:** Multi-platform (Android, Web)
          **Download:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}